<div id="sig-widget" class="sig-widget">
<style>
.sig-widget { --sig-ink:#2b2b2b; --sig-muted:#777; --sig-grid:#e6e6e6; --sig-ours:#9a9a9a; --sig-curve:#2c7fb8; --sig-cost:#555; --sig-bg:#fafafa;
  border:1px solid var(--sig-grid); border-radius:8px; padding:14px 16px; margin:18px 0; background:var(--sig-bg); color:var(--sig-ink); font-size:14px; }
.sig-widget h4 { margin:0 0 4px 0; font-size:16px; }
.sig-widget .sig-sub { color:var(--sig-muted); margin:0 0 10px 0; font-size:13px; }
.sig-widget .sig-controls { display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:10px 18px; margin-bottom:8px; }
.sig-widget label { display:block; font-weight:600; font-size:13px; }
.sig-widget label span { font-weight:400; color:var(--sig-muted); }
.sig-widget input[type=range] { width:100%; }
.sig-widget svg { width:100%; height:auto; display:block; }
.sig-widget table { border-collapse:collapse; width:100%; font-size:13px; margin-top:6px; }
.sig-widget th, .sig-widget td { padding:3px 6px; text-align:right; border-bottom:1px solid var(--sig-grid); }
.sig-widget th:first-child, .sig-widget td:first-child { text-align:left; }
.sig-widget button { margin-top:6px; padding:4px 10px; border:1px solid #bbb; border-radius:5px; background:#fff; cursor:pointer; font-size:13px; }
.sig-widget .sig-legend { font-size:12px; color:var(--sig-muted); margin-top:2px; }
.sig-widget .sig-legend b { display:inline-block; width:18px; height:3px; vertical-align:middle; margin:0 4px 0 10px; }
</style>
<h4>Build your own rage curve</h4>
<p class="sig-sub">Move the four knobs and watch the curve, and the spare rage at each phase, change. The grey dashed line is the sigmoid used in this chapter.</p>
<div class="sig-controls">
  <div><label>Floor, F <span id="sig-F-v"></span></label><input id="sig-F" type="range" step="0.1"></div>
  <div><label>Ceiling, C <span id="sig-C-v"></span></label><input id="sig-C" type="range" step="0.1"></div>
  <div><label>Midpoint, m <span id="sig-m-v"></span></label><input id="sig-m" type="range" step="0.5"></div>
  <div><label>Width, w <span id="sig-w-v"></span></label><input id="sig-w" type="range" step="0.1"></div>
</div>
<svg id="sig-plot" viewBox="0 0 640 330" role="img" aria-label="Rage per second against weapon DPS"></svg>
<div class="sig-legend"><b style="background:#2c7fb8"></b>Your curve<b style="background:#9a9a9a"></b>Ours<b style="background:#555;height:1px"></b>Core rotation cost</div>
<table id="sig-table"></table>
<button id="sig-reset" type="button">Reset to ours</button>
</div>
<script>
(function () {
  var cfg = window.SIG_CFG;
  var el = function (id) { return document.getElementById(id); };
  var knobs = { F: [3, 12], C: [8, 24], m: [40, 75], w: [0.5, 15] };
  Object.keys(knobs).forEach(function (k) {
    var s = el("sig-" + k); s.min = knobs[k][0]; s.max = knobs[k][1]; s.value = cfg.ours[k];
    s.addEventListener("input", draw);
  });
  el("sig-reset").addEventListener("click", function () {
    Object.keys(knobs).forEach(function (k) { el("sig-" + k).value = cfg.ours[k]; }); draw();
  });
  function sig(d, p) { return p.F + (p.C - p.F) / (1 + Math.exp(-(d - p.m) / p.w)); }
  var W = 640, H = 330, L = 48, R = 16, T = 12, B = 36, x0 = 35, x1 = 80, y0 = 0, y1 = 25;
  function X(d) { return L + (d - x0) / (x1 - x0) * (W - L - R); }
  function Y(r) { return T + (1 - (r - y0) / (y1 - y0)) * (H - T - B); }
  function path(p) {
    var s = "";
    for (var d = x0; d <= x1 + 1e-9; d += 0.25) s += (s ? "L" : "M") + X(d).toFixed(1) + "," + Y(Math.min(Math.max(sig(d, p), y0), y1)).toFixed(1);
    return s;
  }
  function draw() {
    var p = {}; Object.keys(knobs).forEach(function (k) { p[k] = parseFloat(el("sig-" + k).value); });
    el("sig-F-v").textContent = p.F.toFixed(1) + " rage/sec";
    el("sig-C-v").textContent = p.C.toFixed(1) + " rage/sec";
    el("sig-m-v").textContent = p.m.toFixed(1) + " weapon DPS";
    el("sig-w-v").textContent = p.w.toFixed(1) + " weapon DPS";
    var g = "";
    for (var r = 0; r <= y1; r += 5) g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(r) + '" y2="' + Y(r) + '" stroke="#e6e6e6"/><text x="' + (L - 6) + '" y="' + (Y(r) + 4) + '" font-size="11" text-anchor="end" fill="#777">' + r + '</text>';
    for (var d = 40; d <= 80; d += 10) g += '<text x="' + X(d) + '" y="' + (H - B + 16) + '" font-size="11" text-anchor="middle" fill="#777">' + d + '</text>';
    cfg.phases.forEach(function (ph) {
      g += '<line x1="' + X(ph.dps) + '" x2="' + X(ph.dps) + '" y1="' + T + '" y2="' + (H - B) + '" stroke="#c8c8c8" stroke-dasharray="2,3"/>' +
           '<text x="' + (X(ph.dps) + 3) + '" y="' + (T + 10) + '" font-size="10" fill="#888">' + ph.phase + '</text>';
    });
    g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(cfg.cost) + '" y2="' + Y(cfg.cost) + '" stroke="#555" stroke-dasharray="1,2"/>';
    g += '<path d="' + path(cfg.ours) + '" fill="none" stroke="#9a9a9a" stroke-width="2" stroke-dasharray="6,4"/>';
    g += '<path d="' + path(p) + '" fill="none" stroke="#2c7fb8" stroke-width="3"/>';
    g += '<text x="' + ((L + W - R) / 2) + '" y="' + (H - 4) + '" font-size="12" text-anchor="middle" fill="#444">Main-hand weapon DPS</text>';
    g += '<text transform="translate(12,' + ((T + H - B) / 2) + ') rotate(-90)" font-size="12" text-anchor="middle" fill="#444">Rage per second from white hits</text>';
    el("sig-plot").innerHTML = g;
    var rows = "<tr><th>Phase</th><th>Rage per second</th><th>Spare rage per minute</th><th>Change from ours</th></tr>";
    cfg.phases.forEach(function (ph) {
      var r = sig(ph.dps, p), o = sig(ph.dps, cfg.ours), spare = Math.max(r - cfg.cost, 0) * 60;
      rows += "<tr><td>" + ph.phase + "</td><td>" + r.toFixed(1) + "</td><td>" + spare.toFixed(0) + "</td><td>" + (r - o >= 0 ? "+" : "") + ((r - o) * 60).toFixed(0) + " rage/min</td></tr>";
    });
    el("sig-table").innerHTML = rows;
  }
  draw();
})();
</script>
